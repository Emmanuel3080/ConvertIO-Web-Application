<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Modern Gradient -->
    <linearGradient id="convrtioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    
    <!-- Subtle Glass Edge Highlight for Contrast on Dark/Light Themes -->
    <linearGradient id="convrtioRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Glowing Cyan Gradient for Bottom Return Arrow -->
    <linearGradient id="convrtioCyan" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <!-- Modern App Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#convrtioBg)" stroke="url(#convrtioRim)" stroke-width="1.5" />

  <!-- Top Conversion Arrow (Pointing Right) -->
  <path d="M16 23h30" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <path d="M36 14l11 9-11 9" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Conversion Arrow (Pointing Left) -->
  <path d="M48 41H18" stroke="url(#convrtioCyan)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M28 32l-11 9 11 9" stroke="url(#convrtioCyan)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>